<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Hello World</title>
    <!-- CSS ফাইল লিঙ্ক করা হলো -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- প্রধান টাইটেল -->
        <h1 class="main-title">Glow Hello World!</h1>
        
        <!-- সাবটাইটেল -->
        <p class="subtitle">Step up your make-up game.</p>

        <!-- প্রোডাক্ট বক্সের গ্রুপ -->
        <div class="product-group">
            
            <!-- প্রোডাক্ট ১: Lipstick -->
            <div class="product-box lipstick">
                <span class="icon">💄</span>
                <h3>Lipstick</h3>
                <p>Ruby Red</p>
            </div>

            <!-- প্রোডাক্ট ২: Eyeliner -->
            <div class="product-box eyeliner">
                <span class="icon">🖊️</span>
                <h3>Eyeliner</h3>
                <p>Jet Black</p>
            </div>

            <!-- প্রোডাক্ট ৩: Eyeshadow -->
            <div class="product-box eyeshadow">
                <span class="icon">🎨</span>
                <h3>Eyeshadow</h3>
                <p>Nude Palette</p>
            </div>

        </div>

    </div>

    <!-- JavaScript ফাইল লিঙ্ক করা হলো -->
    <script src="script.js"></script>
</body>
</html>
